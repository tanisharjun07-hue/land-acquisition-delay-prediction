version: '3.8'

services:
  
  api:
    build: .
    container_name: land-acquisition-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: python fastapi_backend.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: land-acquisition-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run enhanced_portal.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  default:
    name: land-acquisition-network
